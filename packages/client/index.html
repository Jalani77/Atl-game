<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Campus Rivals</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      background: #1a1a2e;
    }
    #game-container {
      width: 100%;
      height: 100%;
      position: relative;
    }
    canvas {
      display: block;
    }
    .ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .ui-layer > * {
      pointer-events: auto;
    }
    .title-font {
      font-family: 'Bangers', cursive;
    }
    .hud-panel {
      background: rgba(255, 250, 242, 0.92);
      color: #243044;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(36, 48, 68, 0.16);
      border: 2px solid rgba(255, 255, 255, 0.8);
    }
    .hud-icon {
      width: 22px;
      height: 22px;
      display: block;
    }
    .hud-objective {
      background: #243044;
      color: #fff;
      border-radius: 999px;
      padding: 0.45rem 0.9rem;
      font-size: 0.85rem;
      font-weight: 600;
    }
    #help-panel summary {
      cursor: pointer;
      font-weight: 700;
      color: #243044;
    }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
